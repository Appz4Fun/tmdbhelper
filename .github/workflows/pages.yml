# Checks the code and the prose, builds the documentation site from site/ and
# the Entware opkg feed, and deploys both to GitHub Pages. Pull requests get the
# checks and the builds. Only a push to the default branch deploys.
# The job runs on arm64, so the musl build for the opkg package is a native one.
name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: site/requirements.lock

      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r site/requirements.lock

      - name: Install Vale
        run: |
          mkdir -p "$RUNNER_TEMP/vale"
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/vale.tar.gz" \
            https://github.com/vale-cli/vale/releases/download/v3.24.0/vale_3.24.0_Linux_arm64.tar.gz
          echo "104cbd349279e50c4cb40adb70adf345d93cc4a3a0191f9e68bdccb97086b582  $RUNNER_TEMP/vale.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/vale.tar.gz" -C "$RUNNER_TEMP/vale" vale
          echo "$RUNNER_TEMP/vale" >> "$GITHUB_PATH"

      - name: Test and lint
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked

      - name: Check that the committed help text is current
        run: |
          cargo run --quiet --locked -- --help > site/data/help.txt
          git diff --exit-code site/data/help.txt

      - name: Check prose (Google style)
        # bash -o pipefail: a Vale failure must not hide behind tee
        shell: bash
        run: |
          mkdir -p target/vale
          python scripts/help-to-md.py < site/data/help.txt > target/vale/help.md
          python scripts/extract-strings.py src target/vale/strings.md
          vale --version
          vale --minAlertLevel=warning --output=line README.md TODO.md site/content target/vale/help.md target/vale/strings.md | tee "$RUNNER_TEMP/vale.txt"
          if [ -s "$RUNNER_TEMP/vale.txt" ]; then
            echo "::error::Vale found prose problems. Fix them or add the word to the WarmupRs vocabulary."
            exit 1
          fi

      - name: Build the site
        run: python site/build.py --out "$RUNNER_TEMP/site"

      - name: Check links and pages
        run: python site/check.py "$RUNNER_TEMP/site"

      - name: Build the opkg feed
        env:
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: |
          sudo apt-get install --yes --no-install-recommends musl-tools
          rustup target add aarch64-unknown-linux-musl
          cargo build --release --locked --target aarch64-unknown-linux-musl
          target/aarch64-unknown-linux-musl/release/warmup-rs --mode=smoke
          python scripts/build-ipk.py --binary target/aarch64-unknown-linux-musl/release/warmup-rs --out "$RUNNER_TEMP/site/opkg"

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
