# Vale settings for the docs, the help text, and the strings in the source.
#   just vale-lint
# The Google style is vendored in .vale/styles/Google from
# https://github.com/vale-cli/Google (MIT). Update it with `vale sync`.
StylesPath = .vale/styles
MinAlertLevel = suggestion
Packages = Google
Vocab = WarmupRs

[*.{md,txt}]
BasedOnStyles = Vale, Google
# A definition list item starts with ": " on its own line. That marker is
# markup, not a colon in a sentence.
TokenIgnores = (?m)^:[ ](?=\S)
